# Keeps the pinned GitHub Actions in .github/workflows current. A pinned commit SHA never moves on
# its own, which is the point of pinning, so without this the pins would silently age. Each update
# arrives as a pull request that runs the normal gate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # npm: security updates only, grouped into one pull request. They fire when an advisory is published; `schedule` governs version
  # updates only. `open-pull-requests-limit: 0` switches off routine version bumps (the owner's rule is small, reviewed changes).
  # NOT EFFECTIVE until the repository setting "Dependabot security updates" (and "Dependabot alerts") is on: docs/PROGRAM.md O-9.
  # Three advisories published in October failed the audit step on every branch (docs/INSIGHTS.md I-22).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
