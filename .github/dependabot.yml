# Keeps the pinned GitHub Actions in .github/workflows current. A pinned commit SHA never moves on
# its own, which is the point of pinning, so without this the pins would silently age. Each update
# arrives as a pull request that runs the normal gate.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # npm: security updates only, grouped into one pull request, checked weekly. `open-pull-requests-limit: 0` switches off
  # routine version bumps (they are not wanted: the owner's rule is small, reviewed changes) and leaves security updates on.
  # Three advisories published in October failed the audit step on every branch (docs/INSIGHTS.md I-22).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
