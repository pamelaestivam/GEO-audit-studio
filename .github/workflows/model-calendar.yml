name: Model calendar

# Weekly: is any default model id near its published end date, or its confirmation too old to trust? (src/modelCalendar.ts, item G1.9
# of docs/ENGINEERING_BACKLOG.md). The run goes RED with one sentence per problem, naming the vendor page to re-read. A scheduled
# run that fails emails the repository owner through GitHub's own notifications; this check needs no secret and no money.
# It is deliberately not part of `npm test`: a vendor publishing a date must not turn every pull request red.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pin as the confidenceHigh repository
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # same pin as the confidenceHigh repository
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the model calendar
        run: |
          set -o pipefail
          npx tsx scripts/model-calendar-check.ts | tee calendar.log
          code=${PIPESTATUS[0]}
          {
            echo "## Model calendar"
            echo '```'
            cat calendar.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
