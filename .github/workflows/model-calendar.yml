name: Model calendar

# Weekly: is any default model id past or near its published end date, or its confirmation too old to trust? (src/modelCalendar.ts,
# item G1.9 of docs/ENGINEERING_BACKLOG.md). A failure is never only a red run nobody opens (the same rule as live-check.yml): it opens
# ONE tracking issue with one sentence per problem, comments on it each later week while something is still due, and closes it when
# a run finds nothing due. GitHub emails a failed scheduled run only to the person who last changed the cron line, so the issue is
# the notice that reaches the owner. NOTE: GitHub pauses scheduled workflows after 60 days without repository activity; a start by
# hand (Actions tab, "Run workflow") restarts the clock.
# It needs no secret and no money, and is deliberately not part of `npm test`: a vendor date must not turn every pull request red.
# Known and unresolved problems keep the issue open (and commented weekly) until the id or the calendar changes: docs/PROGRAM.md O-10.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pin as the confidenceHigh repository
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # same pin as the confidenceHigh repository
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the model calendar
        id: calendar
        run: |
          set +e
          npx tsx scripts/model-calendar-check.ts > calendar.log 2>&1
          code=$?
          cat calendar.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Model calendar"
            echo '```'
            cat calendar.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Open, update or close the one tracking issue
        if: always()
        run: |
          set -e
          code="${{ steps.calendar.outputs.code || 1 }}"   # a step that never ran (a failed install) counts as due
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create model-calendar --color FBCA04 --description "Opened by the model-calendar workflow" 2>/dev/null || true
          number=$(gh issue list --state open --label model-calendar --limit 1 --json number --jq '.[0].number')
          if [ "$code" = "0" ]; then
            if [ -n "$number" ]; then gh issue close "$number" --comment "A run found nothing due. Run: $run_url"; fi
            exit 0
          fi
          {
            echo "Something about the default models is due (checked $(date -u +%Y-%m-%d)). Run: $run_url"
            echo
            echo '```'
            grep '^DUE' calendar.log || cat calendar.log
            echo '```'
            echo
            echo "What to do: read the vendor page named in each line, then change the id in \`src/providers.ts\` and/or the entry in \`src/modelCalendar.ts\` (the date it was read and what the page said). Owner steps are in \`docs/PROGRAM.md\` O-10. This issue is reused: later weeks comment here while something is due, and a run that finds nothing due closes it."
          } > body.md
          if [ -n "$number" ]; then gh issue comment "$number" --body-file body.md
          else gh issue create --title "Model calendar: a default model is due for attention" --label model-calendar --body-file body.md; fi
          # the run itself also goes red, so it shows in the Actions list
          exit 1
