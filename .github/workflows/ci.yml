name: CI

# Every push and PR runs the same gate the owner's working notes require before
# a merge: typecheck, then `npm test` (build + unit + real-server E2E + contract
# checks). main auto-deploys, so a red run here is a red release.
#
# This workflow is the whole merge gate and needs no container registry (it still
# downloads npm packages and the Playwright browser). The Docker image build is a separate, optional workflow
# (docker.yml) because it depends on a third-party registry that rate-limits shared
# runners, and a gate that fails for reasons outside the code teaches people to
# ignore it. Whether the DEPLOYED site works is live-check.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pin as the confidenceHigh repository
      - name: No tracked symlinks
        # A symlink named node_modules (pointing at a path outside the checkout) was
        # committed once by `git add -A` and CI stayed green because npm ci replaced it.
        # Nothing here needs a tracked symlink; one is always a mistake.
        run: |
          links=$(git ls-files -s | awk '$1 == "120000" {print $4}')
          if [ -n "$links" ]; then
            echo "Tracked symlinks are not allowed in this repository:"
            echo "$links"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # same pin as the confidenceHigh repository
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser tests drive the real built app in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
        env:
          CI: 'true'
      # The built server must run from a clean directory with ONLY production
      # dependencies - what a Docker/Render/VPS build actually has. It also boots the
      # server, runs the smoke test, restarts it on the same data directory, proves the
      # database file kept the data and that the restarted server writes to that same file,
      # and takes and checks a backup. It does NOT prove the Docker image builds: that is
      # docker.yml, which is not a merge gate.
      - run: bash scripts/prod-install-check.sh
